name: Daten aktualisieren

# Code (Branch main) und Daten (Branch daten) sind getrennt: Dieser Workflow läuft mit dem Code aus main und
# schreibt nur in den Branch daten. Den Code-Checkout ohne Zugangsdaten auschecken; ein Ruleset auf main
# verhindert zusätzlich, dass das Token des Workflows dort etwas ändert (README: "Code und Daten trennen").
# Actions sind auf einen Commit festgelegt (Kommentar: Version): Ein nachträglich verschobenes Tag kann so keinen
# fremden Code mit Schreibrechten auf den Branch daten ausführen. Runner fest auf Ubuntu 26.04 (Python 3.14).

on:
  schedule:
    - cron: "17 3 * * *"     # täglich 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-26.04
    timeout-minutes: 45      # Ubuntu: ca. 800 MB laden, 8 GB entpackt kürzen
    steps:
      - name: Code (main) auschecken, ohne Schreibrechte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Daten (Branch daten) auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: daten
          path: daten

      - name: OSV-Exporte laden und gekürzt in den Branch daten schreiben
        run: python3 container-security-scan.py --daten-erzeugen daten

      # Fehler bei endoflife.date verhindern nicht die Aktualisierung der OSV-Daten; bleibt die Datei
      # länger als 30 Tage alt, warnt der Scanner.
      - name: EOL-Daten von endoflife.date laden
        id: eol
        continue-on-error: true
        run: python3 container-security-scan.py --eol-daten-erzeugen daten/eol-daten.json

      # Katalog aktiv ausgenutzter Schwachstellen (CISA KEV); fehlt er länger als 7 Tage, warnt der Scanner.
      - name: KEV-Daten der CISA laden
        id: kev
        continue-on-error: true
        run: python3 container-security-scan.py --kev-daten-erzeugen daten/kev.json

      # SUSEs eigene CVSS-Bewertung je CVE (Schweregrad der Funde aus den SUSE-Daten). Ist sie älter als 7 Tage,
      # warnt der Scanner und nutzt sie weiter; fehlt sie, warnt er und nimmt den Schweregrad aus anderen Quellen.
      - name: Schweregrade von SUSE laden
        id: suse
        continue-on-error: true
        run: python3 container-security-scan.py --suse-schweregrad-erzeugen daten/suse-schweregrad.json

      - name: Änderungen im Branch daten committen
        working-directory: daten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -q -m "OSV-, EOL-, KEV- und SUSE-Daten $(date -u +%F)"
            git push origin HEAD:daten
          fi

      - name: EOL-Fehler melden
        if: steps.eol.outcome == 'failure'
        run: |
          echo "::warning::EOL-Daten konnten nicht aktualisiert werden"
          exit 1

      - name: KEV-Fehler melden
        if: steps.kev.outcome == 'failure'
        run: |
          echo "::warning::KEV-Daten konnten nicht aktualisiert werden"
          exit 1

      - name: SUSE-Fehler melden
        if: steps.suse.outcome == 'failure'
        run: |
          echo "::warning::Schweregrade von SUSE konnten nicht aktualisiert werden"
          exit 1
