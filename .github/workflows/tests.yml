name: Tests

on:
  push:
    paths: ["container-security-scan.py", "README.md", "tests/**", "installation/**", "beispiele/**",
            ".github/workflows/tests.yml"]
    # Tags (Releases): Pfadfilter gelten dafür nicht, die Tests laufen immer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Unit-Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    # offizielle Python-Images statt setup-python: dort gibt es auch ältere Versionen (3.6 wie SLES 15)
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.6", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  docker:
    name: Integrationstest mit Docker
    runs-on: ubuntu-26.04
    needs: unittest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Daten (Branch daten) nach daten/ auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: daten
          path: daten
          persist-credentials: false
      - run: docker pull -q nginx:1.27-alpine && docker pull -q node:20-alpine && docker pull -q traefik:v3.3 && docker pull -q redis:7-alpine
      - run: python3 -m unittest discover -s tests -p "test_docker.py" -v
        env:
          CSS_DOCKER_TESTS: "1"
      # Beispiele mit dem aktuellen Stand erzeugen: prüft erzeugen.sh und liefert sie für ein Release (README: Releases)
      - name: Beispiele erzeugen
        run: sudo bash beispiele/erzeugen.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: beispiele
          path: |
            beispiele/ausgabe.txt
            beispiele/scan_*

  installation:
    name: Installscript und Wrapper
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # für das Bundle mit vollständiger Historie
          persist-credentials: false
      # wie auf einem Server, aber aus einem lokalen Tag des geprüften Stands (nicht gepusht)
      - name: Aus lokalem Tag installieren
        run: |
          V=v$(python3 container-security-scan.py --version | cut -d" " -f2)
          git tag -f "$V"
          git bundle create "$RUNNER_TEMP/css.bundle" "$V"
          sudo env REPO="$RUNNER_TEMP/css.bundle" bash installation/installieren.sh "$V" "$(git rev-parse HEAD)"
          sudo env REPO="$RUNNER_TEMP/css.bundle" bash installation/installieren.sh "$V"    # Aktualisieren
          test "$(python3 -I /opt/container-security-scan/container-security-scan.py --version)" = "container-security-scan ${V#v}"
          if sudo env REPO="$RUNNER_TEMP/css.bundle" bash installation/installieren.sh v0.0.0; then exit 1; fi   # kein Tag
      - name: Wrapper ausführen (ohne laufende Container)
        run: |
          sudo /usr/local/sbin/container-security-scan-lauf | tee "$RUNNER_TEMP/lauf.txt"
          grep -q "^ERGEBNIS: OK" "$RUNNER_TEMP/lauf.txt"
