# PHP-Anwendung, nur über nginx erreichbar (Listen 127.0.0.1:8080), PHP über php-fpm
<VirtualHost 127.0.0.1:8080>
    ServerName app.example.org
    DocumentRoot /srv/www/app/public
    <Directory /srv/www/app/public>
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>
</VirtualHost>
