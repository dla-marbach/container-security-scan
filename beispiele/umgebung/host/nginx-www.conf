# Öffentliche Website: statische Dateien (mit eingebettetem jQuery), /app/ an Apache (nur Loopback)
server {
    listen 80;
    listen 443 ssl;
    server_name www.example.org example.org;
    ssl_certificate /etc/nginx/ssl/www.crt;
    ssl_certificate_key /etc/nginx/ssl/www.key;
    root /srv/www/htdocs;
    location /app/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host app.example.org;
    }
    location /nginx_status { stub_status; }     # ohne allow/deny: WEB-STATUS
}

# Alte Partner-Schnittstelle: TLS 1.0 und 1.1 ausdrücklich erlaubt (WEB-TLS-ALT)
server {
    listen 8443 ssl;
    server_name partner.example.org;
    ssl_certificate /etc/nginx/ssl/www.crt;
    ssl_certificate_key /etc/nginx/ssl/www.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_conf_command MinProtocol TLSv1;
    ssl_ciphers DEFAULT:@SECLEVEL=0;
    location / { proxy_pass http://127.0.0.1:8080/; }
}

# Intranet: Verzeichnisliste (WEB-AUTOINDEX)
server {
    listen 80;
    server_name intranet.example.local;
    root /srv/www/intranet;
    autoindex on;
}
