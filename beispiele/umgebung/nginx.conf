server {
    listen 80;
    server_name shop.example.org;
    root /srv/app/public;

    location / {
        proxy_pass http://app-node:3000;
    }
    location ~ \.php$ {
        fastcgi_pass app-php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
